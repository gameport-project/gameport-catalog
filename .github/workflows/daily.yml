name: Daily catalog

# Once a day, reads the Steam apps that have an Android build and commits v1/catalog.json and v1/text when they changed. The prices have their own, more frequent workflow.
# Needs the secret STEAM_API_KEY (a Steam Web API key: https://steamcommunity.com/dev/apikey).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# The two workflows push to the same branch: one at a time.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: The tests of the rules
        run: python3 -m unittest -v
      # What the catalog was before this run: the announcement of the new Android versions compares with it.
      - name: Keep the catalog as it was
        run: cp v1/catalog.json "$RUNNER_TEMP/previous-catalog.json"
      - name: Read Steam and write the catalog
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python3 refresh.py
      - name: Commit what changed
        run: |
          # The catalog, the texts and the pictures of the store pages (media.json): git status also sees the files that are new.
          if [ -z "$(git status --porcelain -- v1/catalog.json v1/media.json v1/text)" ]; then
            echo "nothing changed"
          else
            count="$(grep -o '"count":[0-9]*' v1/catalog.json | head -1 | cut -d: -f2)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v1/catalog.json v1/media.json v1/text
            git commit -m "data: update the catalog and its texts (${count} apps)"
            # Whatever else the script wrote and is not committed must not stop the pull.
            git pull --rebase --autostash
            git push
          fi
      # Asks the site to rebuild itself now, so it shows the new catalog without waiting for its own schedule (every six hours, for the players' answers).
      # Needs the secret SITE_DISPATCH_TOKEN: a token that may start workflows of the site's repository (see the README). Skipped without it; a failure here changes nothing.
      - name: Rebuild the site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SITE_DISPATCH_TOKEN is not set: the site rebuilds on its own schedule"; exit 0; fi
          gh api -X POST repos/gameport-project/gameport-project.github.io/actions/workflows/pages.yml/dispatches -f ref=main
      # Tells the Discord channel of the new Android versions which games, demos, betas or applications became installable in this run. Skipped without the secret;
      # a failure here changes nothing of the catalog, which is already written. DISCORD_NEW_GAMES_ROLE_ID (a variable of the repository) names the role to mention.
      - name: Announce the new Android versions
        continue-on-error: true
        env:
          DISCORD_NEW_GAMES_WEBHOOK: ${{ secrets.DISCORD_NEW_GAMES_WEBHOOK }}
          DISCORD_NEW_GAMES_ROLE_ID: ${{ vars.DISCORD_NEW_GAMES_ROLE_ID }}
        run: |
          if [ -z "$DISCORD_NEW_GAMES_WEBHOOK" ]; then echo "DISCORD_NEW_GAMES_WEBHOOK is not set: nothing announced"; exit 0; fi
          python3 announce_new.py "$RUNNER_TEMP/previous-catalog.json"
      # GitHub switches off the schedule of a public repository after 60 days without activity: this keeps it on.
      - name: Keep the schedule on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
